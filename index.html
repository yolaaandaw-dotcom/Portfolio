<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yao Wang — Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500;600&family=Roboto+Serif:ital,opsz,wght@0,8..144,300;0,8..144,400;0,8..144,500;0,8..144,600;1,8..144,400&display=swap" rel="stylesheet" />
  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: Roboto, system-ui, sans-serif;
      font-weight: 300;
      background: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }
    button { font: inherit; }
    a { color: inherit; }
    .tweaks {
      position: fixed; right: 20px; bottom: 20px; z-index: 1000;
      width: 260px; background: #0a0a0a; color: #f1f1f1;
      border: 1px solid rgba(255,255,255,0.12);
      font-family: 'Roboto Mono', ui-monospace, monospace;
      font-size: 11px; letter-spacing: 0.3px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.28);
    }
    .tweaks header {
      padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-between; align-items: center;
      text-transform: uppercase; letter-spacing: 1.2px; font-size: 10px; color: #c6ff00;
    }
    .tweaks .body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .tweaks .row { display: flex; flex-direction: column; gap: 6px; }
    .tweaks label { color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 0.8px; font-size: 9px; }
    .tweaks .opts { display: flex; gap: 6px; flex-wrap: wrap; }
    .tweaks .opts button {
      all: unset; cursor: pointer; padding: 5px 9px; border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8); font-size: 10.5px; letter-spacing: 0.3px;
    }
    .tweaks .opts button.on { background: #c6ff00; color: #0a0a0a; border-color: #c6ff00; }
    .tweaks .opts button:hover:not(.on) { background: rgba(255,255,255,0.06); color: #fff; }
    .tweaks footer {
      padding: 8px 14px; border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 9.5px; color: rgba(255,255,255,0.4); letter-spacing: 0.6px; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="variants/field-notebook.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "tight",
      "pair": "sans-mono"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
      const [editMode, setEditMode] = React.useState(false);

      React.useEffect(() => {
        const onMsg = (e) => {
          const d = e.data;
          if (!d || typeof d !== 'object') return;
          if (d.type === '__activate_edit_mode') setEditMode(true);
          else if (d.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const patch = (k, v) => {
        setTweaks((t) => {
          const next = { ...t, [k]: v };
          try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch (_) {}
          return next;
        });
      };

      const data = window.PORTFOLIO_DATA;

      return (
        <>
          <div style={{ minHeight: '100vh' }}>
            <FieldNotebook data={data} density={tweaks.density} pair={tweaks.pair} />
          </div>
          {editMode && <TweaksPanel tweaks={tweaks} patch={patch} />}
        </>
      );
    }

    function TweaksPanel({ tweaks, patch }) {
      const Opt = ({ k, v, label }) => (
        <button className={tweaks[k] === v ? 'on' : ''} onClick={() => patch(k, v)}>{label}</button>
      );
      return (
        <div className="tweaks">
          <header>
            <span>Tweaks</span>
            <span style={{ color: 'rgba(255,255,255,0.4)' }}>portfolio.yw</span>
          </header>
          <div className="body">
            <div className="row">
              <label>layout density</label>
              <div className="opts">
                <Opt k="density" v="tight" label="tight" />
                <Opt k="density" v="airy"  label="airy" />
              </div>
            </div>
            <div className="row">
              <label>type pairing</label>
              <div className="opts">
                <Opt k="pair" v="sans-mono"  label="sans + mono" />
                <Opt k="pair" v="serif-mono" label="serif + mono" />
                <Opt k="pair" v="serif-sans" label="serif + sans" />
              </div>
            </div>
          </div>
          <footer>easter egg: type &quot;wang&quot;</footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
